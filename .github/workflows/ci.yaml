name: CI
 
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
 
jobs:
  pipeline:
    uses: HospitalManagementSystem-HMS/Hospital-Management/.github/workflows/backend-template.yaml@dev
 
    with:
      service: "user-service"
      image: "ghcr.io/HospitalManagementSystem-HMS/user-service"
      sonar_key: "user-service"
      trigger: ${{ github.event_name }}
 
    secrets: inherit